name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, beta, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build without cgo
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/typetype-server

      - name: Build the image
        run: docker build --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" .
