name: Image

on:
  push:
    branches: [dev, beta, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/typetype-video/typetype-server-go

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          case "$GITHUB_REF_NAME" in
            dev) tags="$IMAGE:dev,$IMAGE:dev-$short" ;;
            beta) tags="$IMAGE:beta,$IMAGE:beta-$short" ;;
            main) tags="$IMAGE:latest,$IMAGE:main-$short" ;;
            *) exit 64 ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$GITHUB_REF_NAME-$short" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.tags.outputs.time }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
