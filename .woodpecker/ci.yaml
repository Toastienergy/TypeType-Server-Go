clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0@sha256:0f06b03ec33137b556c77538563f66c400339052d0c5199d4c3ad1a2a37e1964
    settings:
      depth: 1

when:
  - event: push
    branch: [dev, beta, main]
  - event: pull_request
  - event: manual

services:
  postgres:
    image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_DB: typetype
      POSTGRES_USER: typetype
      POSTGRES_PASSWORD: typetype-ci-only
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b

# The module and build caches live in a volume that outlives the pipeline, so a push only compiles what changed:
# deps fills it, the checks after it reuse the packages, and the race tests, which compile their own build, start at
# once on Debian for its C compiler while the database services start. Go's cache is safe for concurrent writers.
steps:
  - name: deps
    image: golang:1.27.4-alpine3.24@sha256:0a5f7fe796599ff487605987432e7619ae45beeb2fba4c2ce0b907879932aebf
    volumes:
      - typetype-server-go-cache:/cache
    environment:
      GOMODCACHE: /cache/mod
      GOCACHE: /cache/build
      GOFLAGS: -mod=readonly
    commands:
      - go mod download
      - go build ./...

  - name: format-vet
    image: golang:1.27.4-alpine3.24@sha256:0a5f7fe796599ff487605987432e7619ae45beeb2fba4c2ce0b907879932aebf
    depends_on: [deps]
    volumes:
      - typetype-server-go-cache:/cache
    environment:
      GOMODCACHE: /cache/mod
      GOCACHE: /cache/build
      GOFLAGS: -mod=readonly
    commands:
      - |
        unformatted="$$(gofmt -l .)"
        if [ -n "$$unformatted" ]; then
          echo "$$unformatted"
          exit 1
        fi
      - go vet ./...

  - name: test
    image: golang:1.27.4-bookworm@sha256:ce59b41415e2524ae99926fe1f37ce48ba8c194dcbd2a56a65436cdcefa2bd34
    depends_on: []
    volumes:
      - typetype-server-go-cache:/cache
    environment:
      GOMODCACHE: /cache/mod
      GOCACHE: /cache/build
      GOFLAGS: -mod=readonly
      CGO_ENABLED: "1"
      TEST_DATABASE_URL: postgres://typetype:typetype-ci-only@postgres:5432/typetype
      TEST_DRAGONFLY_URL: redis://dragonfly:6379
    commands:
      - go test -race -run '^$$' ./...
      - |
        bash -c 'for attempt in $$(seq 1 60); do
          (echo > /dev/tcp/postgres/5432) 2>/dev/null && (echo > /dev/tcp/dragonfly/6379) 2>/dev/null && exit 0
          sleep 1
        done
        exit 1'
      - go test -race ./...

  - name: build
    image: golang:1.27.4-alpine3.24@sha256:0a5f7fe796599ff487605987432e7619ae45beeb2fba4c2ce0b907879932aebf
    depends_on: [deps]
    volumes:
      - typetype-server-go-cache:/cache
    environment:
      GOMODCACHE: /cache/mod
      GOCACHE: /cache/build
      GOFLAGS: -mod=readonly
      CGO_ENABLED: "0"
    commands:
      - go build -o /dev/null ./cmd/typetype-server
