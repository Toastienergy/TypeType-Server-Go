clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0@sha256:0f06b03ec33137b556c77538563f66c400339052d0c5199d4c3ad1a2a37e1964
    settings:
      partial: false
      depth: 0
      tags: true

when:
  - event: push
    branch: dev
  - event: tag
    ref: refs/tags/v*
  - event: manual

depends_on: [ci]

# The channels of the other TypeType images: dev builds typetype-server-go-beta (dev, beta, latest and
# <last release>-beta.<pipeline>), a vX.Y.Z-rc.N tag publishes X.Y.Z-rc.N and rc, a vX.Y.Z tag publishes X.Y.Z and
# latest; pushes to beta and main build nothing. ko builds both architectures with the Go toolchain on the
# distroless base and pushes: no Docker daemon, no privileged container and no volume.
steps:
  - name: publish
    image: golang:1.27.4-alpine3.24@sha256:0a5f7fe796599ff487605987432e7619ae45beeb2fba4c2ce0b907879932aebf
    environment:
      GHCR_USER:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - apk add --no-cache git >/dev/null
      - |
        set -eu
        tag="$${CI_COMMIT_TAG:-}"
        if [ "$${CI_PIPELINE_EVENT}" = "manual" ] && [ "$${CI_COMMIT_BRANCH:-}" != "dev" ]; then
          tag="$$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$$tag" ]; then
            echo "A manual build outside dev needs a version tag on its commit" >&2
            exit 1
          fi
        fi
        if [ -n "$$tag" ]; then
          version="$${tag#v}"
          if printf '%s\n' "$$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$$'; then
            tags="$$version,latest"
          elif printf '%s\n' "$$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$$'; then
            tags="$$version,rc"
          else
            echo "Version tags look like v1.2.3 or v1.2.3-rc.1, got $$tag" >&2
            exit 1
          fi
          export KO_DOCKER_REPO=ghcr.io/typetype-video/typetype-server-go
        else
          release="$$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)"
          version="$${release#v}-beta.$${CI_PIPELINE_NUMBER}"
          tags="dev,beta,latest,$$version"
          export KO_DOCKER_REPO=ghcr.io/typetype-video/typetype-server-go-beta
        fi
        export VERSION="$$version" REVISION="$${CI_COMMIT_SHA}"
        export SHORT_REVISION="$$(printf '%s' "$${CI_COMMIT_SHA}" | cut -c1-7)"
        export BUILD_TIME="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        ko="go run github.com/google/ko@v0.19.1"
        printf '%s' "$${GHCR_TOKEN}" | $$ko login ghcr.io -u "$${GHCR_USER}" --password-stdin
        $$ko build --bare --sbom=none --tags "$$tags" \
          --image-label "org.opencontainers.image.source=https://github.com/TypeType-Video/TypeType-Server-Go" \
          --image-label "org.opencontainers.image.revision=$${REVISION}" \
          --image-label "org.opencontainers.image.version=$${VERSION}" \
          --image-label "org.opencontainers.image.licenses=AGPL-3.0-only" \
          ./cmd/typetype-server
        echo "Published $${KO_DOCKER_REPO} $$tags"
