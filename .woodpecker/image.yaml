clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0@sha256:0f06b03ec33137b556c77538563f66c400339052d0c5199d4c3ad1a2a37e1964
    settings:
      depth: 1

when:
  - event: push
    branch: [dev, beta, main]
  - event: manual
    branch: [dev, beta, main]

depends_on: [ci]

# ko builds both architectures with the Go toolchain and lays the binary on the distroless base, then pushes: no
# Docker daemon, no privileged container and no volume, so nothing here needs the repository to be trusted.
steps:
  - name: publish
    image: golang:1.27.4-alpine3.24@sha256:0a5f7fe796599ff487605987432e7619ae45beeb2fba4c2ce0b907879932aebf
    environment:
      KO_DOCKER_REPO: ghcr.io/typetype-video/typetype-server-go
      GHCR_USER:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - |
        set -eu
        export SHORT_REVISION="$$(printf '%s' "$${CI_COMMIT_SHA}" | cut -c1-7)"
        case "$${CI_COMMIT_BRANCH}" in
          dev) channel=dev ;;
          beta) channel=beta ;;
          main) channel=latest ;;
          *) echo "No image for branch $${CI_COMMIT_BRANCH}" >&2; exit 1 ;;
        esac
        export VERSION="$${CI_COMMIT_BRANCH}-$${SHORT_REVISION}"
        export REVISION="$${CI_COMMIT_SHA}"
        export BUILD_TIME="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        ko="go run github.com/google/ko@v0.19.1"
        printf '%s' "$${GHCR_TOKEN}" | $$ko login ghcr.io -u "$${GHCR_USER}" --password-stdin
        $$ko build --bare --sbom=none --tags "$${channel},$${VERSION}" \
          --image-label "org.opencontainers.image.source=https://github.com/TypeType-Video/TypeType-Server-Go" \
          --image-label "org.opencontainers.image.revision=$${REVISION}" \
          --image-label "org.opencontainers.image.licenses=AGPL-3.0-only" \
          ./cmd/typetype-server
